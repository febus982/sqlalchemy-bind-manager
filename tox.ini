[tox]
min_version = 4.0
env_list =
    py314
    py313
    py312
    py311
    typing
    lint
    format

[testenv]
; uv-venv-lock-runner uses `uv sync`, so every environment resolves to the
; versions pinned in uv.lock instead of re-resolving to whatever is latest.
; Requires uv.lock to be committed.
runner = uv-venv-lock-runner
dependency_groups = dev
commands =
    pytest

[testenv:py314]
; Run with coverage in one python version to check coverage percentage
commands =
    pytest --cov

[testenv:typing]
commands =
    mypy

[testenv:format]
commands =
    ruff format --check .

[testenv:lint]
commands =
    ruff check .
